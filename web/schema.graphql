"""
One message that produced any event, with the first time of each kind. Carries no contact data: the message id
is the key, and names or e-mails stay behind campaignMessages.contact (contacts.read).
"""
type Responder {
  messageId: UUID!
  channel: Channel!
  openedAtUtc: DateTime
  clickedAtUtc: DateTime
  landingViewAtUtc: DateTime
  unsubscribedAtUtc: DateTime
}

