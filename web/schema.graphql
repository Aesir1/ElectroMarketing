"One person or company. Only imports change contact data, through ContactMerger."
type Contact {
  "PostgreSQL xmin. Send back the value you read to detect concurrent updates."
  rowVersion: UnsignedInt!
  name: String
  "Trimmed and lower-case; unique. First match key of an import."
  email: String
  "As written in the last file that changed it."
  phone: String
  "E.164; unique. Second match key of an import."
  phoneE164: String
  street: String
  postalCode: String
  city: String
  country: String
  obtainedOn: LocalDate
  emailOptOut: Boolean!
  smsOptOut: Boolean!
  postOptOut: Boolean!
  id: UUID!
  createdAtUtc: DateTime!
  createdBy: String
  updatedAtUtc: DateTime
  updatedBy: String
}

