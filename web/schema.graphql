"Counts are unique messages. Rates are per sent message. E-mail opens are approximate (Apple Mail Privacy Protection pre-loads pixels)."
type ChannelStats {
  channel: Channel!
  sent: Int!
  failed: Int!
  skipped: Int!
  opened: Int!
  clicked: Int!
  landingViews: Int!
  unsubscribed: Int!
  openRate: Float!
  clickRate: Float!
}

"CSV header name for each contact field; null when the file has no such column."
type ColumnMapping {
  name: String
  email: String
  phone: String
  street: String
  postalCode: String
  city: String
  country: String
  obtainedOn: String
}

