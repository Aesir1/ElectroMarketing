union DeleteCampaignError = NotFoundError | ConflictError

union DeleteContactListError = NotFoundError

union DeleteDocumentError = NotFoundError

union PreviewImportError = NotFoundError

union RemoveFromContactListError = NotFoundError

union RenameContactListError = NotFoundError | ValidationError

union RenameDocumentError = NotFoundError | ValidationError

union ReplaceDocumentContentError = NotFoundError | ValidationError

union RequestDocumentUploadError = ValidationError | ForbiddenError

union StartCampaignError =
  | NotFoundError
  | ValidationError
  | ConflictError
  | ConcurrencyError

union StartImportError = NotFoundError | ValidationError

union UpdateCampaignError =
  | NotFoundError
  | ValidationError
  | ConflictError
  | ConcurrencyError

