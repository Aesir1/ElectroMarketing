schema {
  query: Query
  mutation: Mutation
}

"Every non-abstract subclass is registered as an extension of the Query type (source-generated registration, see GraphQlSetup)."
type Query {
  campaigns(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: CampaignFilterInput @cost(weight: "10")
    order: [CampaignSortInput!] @cost(weight: "10")
  ): CampaignsConnection
    @authorize(policy: "campaigns.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  campaign(id: UUID!): Campaign
    @authorize(policy: "campaigns.read")
    @cost(weight: "10")
  campaignMessages(
    campaignId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: CampaignMessageFilterInput @cost(weight: "10")
    order: [CampaignMessageSortInput!] @cost(weight: "10")
  ): CampaignMessagesConnection
    @authorize(policy: "campaigns.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  contact(id: UUID!): Contact
    @authorize(policy: "contacts.read")
    @cost(weight: "10")
  contacts(
    filter: ContactFilterInput
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    order: [ContactSortInput!] @cost(weight: "10")
  ): ContactsConnection
    @authorize(policy: "contacts.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "Every CSV row applied to the contact, newest first (UUID v7 ids sort by time)."
  contactHistory(
    contactId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): ContactHistoryConnection
    @authorize(policy: "contacts.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "Own documents (all for platform-admin) with their download path."
  documents(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: DocumentFilterInput @cost(weight: "10")
    order: [DocumentSortInput!] @cost(weight: "10")
  ): DocumentsConnection
    @authorize(policy: "documents.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  document(id: UUID!): Document
    @authorize(policy: "documents.read")
    @cost(weight: "10")
  importBatches(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ImportBatchFilterInput @cost(weight: "10")
    order: [ImportBatchSortInput!] @cost(weight: "10")
  ): ImportBatchesConnection
    @authorize(policy: "contacts.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  categories: [Category!]!
    @authorize(policy: "contacts.read")
    @cost(weight: "10")
  campaignInsights(campaignId: UUID!): CampaignInsightsResult
    @authorize(policy: "insights.read")
    @cost(weight: "10")
  recentCampaignInsights(take: Int! = 10): [CampaignInsightsResult!]!
    @authorize(policy: "insights.read")
    @cost(weight: "10")
  contactLists(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    order: [ContactListSortInput!] @cost(weight: "10")
  ): ContactListsConnection
    @authorize(policy: "contacts.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  contactListMembers(
    listId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): ContactListMembersConnection
    @authorize(policy: "contacts.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  queues: [QueueInfo!]! @authorize(policy: "queues.manage") @cost(weight: "10")
  "The signed-in user, so the UI can show only what the caller may use."
  viewer: Viewer!
}

"Every non-abstract subclass is registered as an extension of the Mutation type (source-generated registration, see GraphQlSetup)."
type Mutation {
  createCampaign(input: CreateCampaignInput!): CreateCampaignPayload!
    @authorize(policy: "campaigns.write")
    @cost(weight: "10")
  updateCampaign(input: UpdateCampaignInput!): UpdateCampaignPayload!
    @authorize(policy: "campaigns.write")
    @cost(weight: "10")
  deleteCampaign(input: DeleteCampaignInput!): DeleteCampaignPayload!
    @authorize(policy: "campaigns.write")
    @cost(weight: "10")
  "Snapshots the list and queues the messages; the dispatcher sends them in the background."
  startCampaign(input: StartCampaignInput!): StartCampaignPayload!
    @authorize(policy: "campaigns.send")
    @cost(weight: "10")
  "Creates a Pending document and returns the path to PUT its content to (max 25 MB, allow-listed types)."
  requestDocumentUpload(input: RequestDocumentUploadInput!): RequestDocumentUploadPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  confirmDocumentUpload(input: ConfirmDocumentUploadInput!): ConfirmDocumentUploadPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  renameDocument(input: RenameDocumentInput!): RenameDocumentPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  replaceDocumentContent(input: ReplaceDocumentContentInput!): ReplaceDocumentContentPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  deleteDocument(input: DeleteDocumentInput!): DeleteDocumentPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  createCategory(input: CreateCategoryInput!): CreateCategoryPayload!
    @authorize(policy: "imports.write")
    @cost(weight: "10")
  "Delimiter, encoding, headers, first 10 rows and a suggested column mapping of an uploaded CSV."
  previewImport(input: PreviewImportInput!): PreviewImportPayload!
    @authorize(policy: "imports.write")
    @cost(weight: "10")
  "Queues the import; poll importBatches for the status."
  startImport(input: StartImportInput!): StartImportPayload!
    @authorize(policy: "imports.write")
    @cost(weight: "10")
  createContactList(input: CreateContactListInput!): CreateContactListPayload!
    @authorize(policy: "lists.write")
    @cost(weight: "10")
  createContactListFromBatch(input: CreateContactListFromBatchInput!): CreateContactListFromBatchPayload!
    @authorize(policy: "lists.write")
    @cost(weight: "10")
  renameContactList(input: RenameContactListInput!): RenameContactListPayload!
    @authorize(policy: "lists.write")
    @cost(weight: "10")
  deleteContactList(input: DeleteContactListInput!): DeleteContactListPayload!
    @authorize(policy: "lists.write")
    @cost(weight: "10")
  "Pass contactIds (selection) or filter (all matching); returns how many were added."
  addToContactList(input: AddToContactListInput!): AddToContactListPayload!
    @authorize(policy: "lists.write")
    @cost(weight: "10")
  removeFromContactList(input: RemoveFromContactListInput!): RemoveFromContactListPayload!
    @authorize(policy: "lists.write")
    @cost(weight: "10")
  "Declares a durable queue bound to domain-events with its own dead-letter queue."
  declareQueue(input: DeclareQueueInput!): DeclareQueuePayload!
    @authorize(policy: "queues.manage")
    @cost(weight: "10")
  "Removes every ready message; returns how many."
  purgeQueue(input: PurgeQueueInput!): PurgeQueuePayload!
    @authorize(policy: "queues.manage")
    @cost(weight: "10")
  deleteQueue(input: DeleteQueueInput!): DeleteQueuePayload!
    @authorize(policy: "queues.manage")
    @cost(weight: "10")
}

type AddToContactListPayload {
  count: Int
  errors: [AddToContactListError!]
}

"Editable while Draft. Starting it snapshots the list into CampaignMessage rows."
type Campaign {
  "PostgreSQL xmin. Send back the value you read to detect concurrent updates."
  rowVersion: UnsignedInt!
  name: String!
  "Null after the list was deleted; sent campaigns keep their messages."
  contactListId: UUID
  sendEmail: Boolean!
  sendSms: Boolean!
  sendPost: Boolean!
  emailSubject: String
  "HTML with placeholders {{Name}}, {{Link}}, {{UnsubscribeLink}}."
  emailBody: String
  smsText: String
  letterBody: String
  landingTitle: String
  "Plain text shown on the public landing page."
  landingBody: String
  status: CampaignStatus!
  startedAtUtc: DateTime
  finishedAtUtc: DateTime
  "The merged letters PDF exists at Guid)."
  lettersReady: Boolean!
  id: UUID!
  createdAtUtc: DateTime!
  createdBy: String
  updatedAtUtc: DateTime
  updatedBy: String
}

type CampaignInsightsResult {
  campaignId: UUID!
  campaignName: String!
  startedAtUtc: DateTime
  channels: [ChannelStats!]!
  responseLatency: [LatencyBucket!]!
  medianResponseHours: Float
  timeline: [TimelinePoint!]!
  byWeekdayHour: [HeatCell!]!
  responderCount: Int!
  responders: [Responder!]!
}

"One contact on one channel. Token is the random id in every link of this message."
type CampaignMessage {
  contact: Contact @authorize(policy: "contacts.read")
  id: UUID!
  campaignId: UUID!
  contactId: UUID!
  channel: Channel!
  token: String!
  status: MessageStatus!
  sentAtUtc: DateTime
  "Failure message or skip reason."
  error: String
}

"A connection to a list of items."
type CampaignMessagesConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [CampaignMessagesEdge!]
  "A flattened list of the nodes."
  nodes: [CampaignMessage!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type CampaignMessagesEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: CampaignMessage!
}

"A connection to a list of items."
type CampaignsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [CampaignsEdge!]
  "A flattened list of the nodes."
  nodes: [Campaign!]
  "Identifies the total count of items in the connection."
